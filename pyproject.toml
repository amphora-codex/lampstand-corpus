[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lampstand-corpus"
version = "0.1.0"
description = "Corpus ingestion, normalization, embedding, and validation pipeline for LampStand."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Amphora LLC" }]
dependencies = [
    "requests>=2.32",        # source snapshot downloads
    "beautifulsoup4>=4.12",  # CCEL HTML parsing
    "lxml>=5.2",             # HTML/USX parsing
    "pydantic>=2.7",         # typed normalized records + provenance
    "rank-bm25>=0.2.2",      # sparse keyword index (reference; pipeline writes its own)
    "numpy>=1.26",           # float32 vector blobs + cosine smoke test
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]
# Heavy: only the P6 embeddings phase needs torch + sentence-transformers
# (~hundreds of MB). Kept OUT of the default install so the light snapshot/
# build/validate phases stay lean. Install with:  pip install -e ".[embeddings]"
# Model weights (BGE-small) are downloaded to a gitignored models/ cache and
# never committed; their hashes are recorded in the embeddings manifest.
embeddings = [
    "sentence-transformers>=3.0",  # BGE-small encoder (spec §4.2)
    "torch>=2.2",                  # CPU/MPS build; no CUDA required
]

[project.scripts]
# Filled in as the CLI takes shape (fetch / normalize / build / validate).
# lampstand-corpus = "lampstand_corpus.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
